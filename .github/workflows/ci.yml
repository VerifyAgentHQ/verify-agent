name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: verify-agent

      - uses: actions/checkout@v4
        with:
          repository: VerifyAgentHQ/verify-contracts
          path: verify-contracts

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: verify-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: verify-agent
      - run: pnpm format:check
        working-directory: verify-agent
      - run: pnpm typecheck
        working-directory: verify-agent
      - run: pnpm test
        working-directory: verify-agent
